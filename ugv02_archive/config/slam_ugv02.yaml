slam_toolbox:
  ros__parameters:
    use_sim_time: false
    mode: mapping

    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan

    resolution: 0.05
    max_laser_range: 6.0
    minimum_travel_distance: 0.03
    minimum_travel_heading: 0.05
    map_update_interval: 0.5
    transform_publish_period: 0.05
    transform_timeout: 1.0
